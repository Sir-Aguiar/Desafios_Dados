services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: desafio_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-plataforma_educacional}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: desafio_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  superset:
    image: apache/superset:3.1.1
    container_name: desafio_superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "desafio_dados_fic_dev_secret_key_2026_super_safe"
      TALISMAN_ENABLED: "False"
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  superset_home: